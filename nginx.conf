server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Logs para debug no Easypanel (aparecem em Container Logs)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Arquivos estáticos - cache curto para facilitar updates
    location ~* \.(jpg|jpeg|png|gif|svg|webp|mp4|mp3|css|js|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA/static - garante que rotas retornem index ou 404 correto
    location / {
        try_files $uri $uri/ =404;
    }

    # Healthcheck para Easypanel/Traefik
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
}
